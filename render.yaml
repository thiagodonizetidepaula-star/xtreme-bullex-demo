services:
  - type: web
    name: xtreme-bullex-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python bootstrap.py
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ACCESS_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
