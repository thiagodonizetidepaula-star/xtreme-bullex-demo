name: Broker quote freshness tests (experimental)
on:
  push:
    branches: [experiment/android-pocket-demo-assist]
    paths:
      - 'broker.py'
      - 'test_broker.py'
      - '.github/workflows/demo-broker-quote-checks.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install websocket-client==1.8.0
      - name: Run unit tests
        run: python -m unittest -v test_broker
      - name: Compile Python modules
        run: python -m py_compile broker.py server.py
