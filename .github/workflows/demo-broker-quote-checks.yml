name: Broker quote freshness tests (experimental)
on:
  push:
    branches: [experiment/android-pocket-demo-assist]
    paths:
      - 'broker.py'
      - 'm1_strategy.py'
      - 'market_radar.py'
      - 'test_market_radar.py'
      - 'test_server.py'
      - 'server.py'
      - 'test_broker.py'
      - 'static/app.js'
      - 'static/index.html'
      - '.github/workflows/demo-broker-quote-checks.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install websocket-client==1.8.0
      - name: Run unit tests
        run: python -m unittest -v test_broker test_market_radar test_server
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Verify V14 multi-duration DEMO quick and M5/M1 engine UI
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('static/index.html').read_text()
          ids=['strategyProfile','warmupStatus','tradeMode','manualActions','autoActions','executeSignal','startSignalAuto','stopSignalAuto','autoSignalStatus','signalDirection','signalStrength','signalBar','offerPair','offerStatus','expiry','asset','amount','score','pause_after','resetHistory','stop_win','stop_loss','limit']
          assert all(html.count('id="'+i+'"')==1 for i in ids)
          assert 'id="call"' not in html and 'id="put"' not in html
          assert 'id="chart"' not in html and 'id="history"' not in html
          assert '<option value="60" selected>1 minuto</option>' in html
          expiry_options=html.split('<select id="expiry">',1)[1].split('</select>',1)[0]
          assert expiry_options.count('<option ') == 20
          assert all(('value="'+str(i)+'"') in expiry_options for i in (3,4,5,6,7,8,9,10,15,20,30,45,60,90,120,180,300,600,900,1800))
          assert '1 hora · indisponível' in expiry_options and '4 horas · indisponível' in expiry_options
          assert 'AUTOMÁTICO · seguir sinal do perfil' in html
          js=Path('static/app.js').read_text()
          assert "api('order-signal',req)" in js
          assert "s.long_signal_offer" in js
          assert "await api('auto',params)" in js
          assert "await action('stop')" in js
          assert "filter_lateral:true" in js
          assert "setInterval(poll,750)" in js
          assert "api('reset-history',{confirm:true})" in js
          print('PASS: V14 DEMO 3 seconds to 30 minutes, quick and M5/M1 expiry choices')
          PY
      - name: Compile Python modules
        run: python -m py_compile broker.py m1_strategy.py market_radar.py server.py
