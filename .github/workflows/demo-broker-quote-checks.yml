name: Broker quote freshness tests (experimental)
on:
  push:
    branches: [experiment/android-pocket-demo-assist]
    paths:
      - 'broker.py'
      - 'test_broker.py'
      - 'static/app.js'
      - 'static/index.html'
      - '.github/workflows/demo-broker-quote-checks.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install websocket-client==1.8.0
      - name: Run unit tests
        run: python -m unittest -v test_broker
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Verify clean scoreboard and DEMO controls
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('static/index.html').read_text()
          ids=['expiry','manual-trade','call','put','auto','score','resetHistory','pause_after','filter_lateral','marketQuality']
          assert all(html.count('id="'+i+'"')==1 for i in ids)
          assert 'id="chart"' not in html
          assert 'id="history"' not in html
          assert 'Histórico da corretora' not in html
          js=Path('static/app.js').read_text()
          assert "body.expiry=Number($('expiry').value)" in js
          assert "body.pause_after=Number($('pause_after').value)" in js
          assert "body.filter_lateral=$('filter_lateral').checked" in js
          assert "api('reset-history',{confirm:true})" in js
          assert "setInterval(poll,750)" in js
          print('PASS: compact scoreboard, 5–30s pause, lateral filter, confirmed reset')
          PY
      - name: Compile Python modules
        run: python -m py_compile broker.py server.py
