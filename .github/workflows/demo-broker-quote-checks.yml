name: Broker quote freshness tests (experimental)
on:
  push:
    branches: [experiment/android-pocket-demo-assist]
    paths:
      - 'broker.py'
      - 'test_broker.py'
      - 'static/app.js'
      - 'static/index.html'
      - '.github/workflows/demo-broker-quote-checks.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install websocket-client==1.8.0
      - name: Run unit tests
        run: python -m unittest -v test_broker
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Verify V9 manual/auto signal panel and DEMO-only actions
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('static/index.html').read_text()
          ids=['tradeMode','manualActions','autoActions','executeSignal','startSignalAuto','stopSignalAuto','autoSignalStatus','signalDirection','signalStrength','signalBar','offerPair','offerStatus','expiry','asset','amount','score','pause_after','resetHistory','stop_win','stop_loss','limit']
          assert all(html.count('id="'+i+'"')==1 for i in ids)
          assert 'id="call"' not in html and 'id="put"' not in html
          assert 'id="chart"' not in html and 'id="history"' not in html
          js=Path('static/app.js').read_text()
          assert "api('order-signal',req)" in js
          assert "await api('auto',params)" in js
          assert "await action('stop')" in js
          assert "filter_lateral:true" in js
          assert "setInterval(poll,750)" in js
          assert "api('reset-history',{confirm:true})" in js
          print('PASS: explicit manual/automatic signal controls')
          PY
      - name: Compile Python modules
        run: python -m py_compile broker.py server.py
