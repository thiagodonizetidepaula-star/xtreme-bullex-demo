name: Android demo connection prototype (not production)
on:
  push:
    branches:
      - experiment/android-pocket-demo-assist
    paths:
      - 'android-experimental/**'
      - '.github/workflows/android-demo-experiment.yml'
  workflow_dispatch:
jobs:
  mock-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-experimental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Socket.IO packet filter with fake WebSocket
        run: node tests/probe.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run local JVM unit tests and assemble unsigned debug prototype
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK as temporary CI artifact (NOT a release)
        uses: actions/upload-artifact@v4
        with:
          name: xtreme-tiger-android-experimental-debug
          path: android-experimental/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
      - name: Publish direct V14 APK download on experimental branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          target="downloads/Xtreme-Tiger-Android-V14-Demo.apk"
          branch="experiment/android-pocket-demo-assist"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$target?ref=$branch" --jq '.sha' 2>/dev/null || true)
          if [ -n "$sha" ]; then
            base64 -w 0 "$apk" | jq -R -s --arg branch "$branch" --arg sha "$sha" --arg message "Update experimental Android V14 APK for mobile downloads" '{branch:$branch,sha:$sha,message:$message,content:.}' | gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$target" --input -
          else
            base64 -w 0 "$apk" | jq -R -s --arg branch "$branch" --arg message "Add experimental Android V14 APK for mobile downloads" '{branch:$branch,message:$message,content:.}' | gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$target" --input -
          fi
          echo "Experimental direct URL: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$branch/$target"
