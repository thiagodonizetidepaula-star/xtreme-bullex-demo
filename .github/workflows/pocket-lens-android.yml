name: Pocket Lens Android DEMO APK
on:
  push:
    branches:
      - pocket-chart-analysis-v1
    paths:
      - 'pocket-chart/android/**'
      - '.github/workflows/pocket-lens-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Android DEMO bridge (no trading against broker)
        working-directory: pocket-chart/android
        run: |
          node test-session-bridge.cjs
          node test-demo-execution.cjs
      - name: Build Android test APK
        working-directory: pocket-chart/android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-Lens-Automatico-Demo-Android
          path: pocket-chart/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
