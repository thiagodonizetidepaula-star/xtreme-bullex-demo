name: Mesa Trader weekly pattern validation
on:
  schedule:
    # Mondays 12:20 UTC / 09:20 Brasília. Runs on GitHub default branch.
    - cron: '20 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MESA_HISTORY_API_URL: ${{ secrets.MESA_HISTORY_API_URL }}
      MESA_HISTORY_TOKEN: ${{ secrets.MESA_HISTORY_TOKEN }}
    steps:
      - name: Verify private research credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$MESA_HISTORY_API_URL" && -n "$MESA_HISTORY_TOKEN" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No secret credentials; NOT training or publishing unverified patterns.'
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          ref: mesa-traders-demo
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.available == 'true'
        with:
          python-version: '3.11'
      - name: Install offline learning dependencies
        if: steps.credentials.outputs.available == 'true'
        run: python -m pip install -r requirements-learning.txt
      - name: Walk-forward retrain and ATOMICALLY replace approvals
        if: steps.credentials.outputs.available == 'true'
        run: python mesa_pattern_train.py --days 7 --train-days 2 --expiration 1 --publish --report mesa_pattern_weekly.json
      - uses: actions/upload-artifact@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          name: mesa-pattern-weekly-results
          path: mesa_pattern_weekly.json
          retention-days: 14
