name: Mesa Pattern weekly validation (DEMO only)
on:
  schedule:
    - cron: '25 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MESA_HISTORY_API_URL: ${{ secrets.MESA_HISTORY_API_URL }}
      MESA_HISTORY_TOKEN: ${{ secrets.MESA_HISTORY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check private research credentials
        id: available
        run: |
          if [ -n "$MESA_HISTORY_API_URL" ] && [ -n "$MESA_HISTORY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Research secrets missing; skipping model publication."
          fi
      - uses: actions/setup-python@v5
        if: steps.available.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - name: Install offline statistical learner
        if: steps.available.outputs.ready == 'true'
        run: pip install -r requirements-learning.txt
      - name: Validate holdout and publish ONLY approved patterns (or empty approval)
        if: steps.available.outputs.ready == 'true'
        run: python mesa_pattern_train.py --days 7 --train-days 2 --expiration 1 --report mesa_pattern_report.json --publish
      - name: Upload audit report (no credentials)
        if: steps.available.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mesa-pattern-weekly-report
          path: mesa_pattern_report.json
          retention-days: 14
