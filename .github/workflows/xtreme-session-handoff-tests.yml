name: Xtreme PRACTICE - reconexão segura PC e celular
on:
  push:
    branches:
      - 'fix/xtreme-practice-idle-session-handoff'
  pull_request:
    paths:
      - 'clean_v1/app.py'
      - 'clean_v1/session_handoff.py'
      - 'test_xtreme_session_handoff.py'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar backend sem autenticar na corretora
        run: python -m py_compile clean_v1/app.py clean_v1/session_handoff.py
      - name: Testar transferência sem interromper operações (Bullix simulado)
        run: python -m unittest test_xtreme_session_handoff -v
      - name: Verificar sintaxe JavaScript do formulário
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          source=Path("clean_v1/app.py").read_text()
          html=source.split("HTML='''",1)[1].split("'''",1)[0]
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.inside=False; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="script" and not dict(attrs).get("src"): self.inside=True
              def handle_endtag(self,tag):
                  if tag=="script":self.inside=False
              def handle_data(self,data):
                  if self.inside:self.scripts.append(data)
          p=Scripts();p.feed(html)
          Path("/tmp/xtreme-inline.js").write_text("\n".join(p.scripts))
          assert 'id="connectError"' in html
          assert 'sessão anterior' in source
          PY
          node --check /tmp/xtreme-inline.js
