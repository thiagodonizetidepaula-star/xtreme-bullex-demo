name: Focus Pocket reset strategy and verified signals
on:
  push:
    branches: [signal-focus-pocket-mobile-v13-20261110]
  workflow_dispatch:
jobs:
  validate-focus-reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests — new strategy and verifiable outcomes
        env:
          PYTHONPATH: signal-focus
        run: |
          python -m unittest discover -v -s signal-focus/test -p test_focus_reset.py
          python -m unittest discover -v -s signal-focus/test -p test_signal_ledger.py
      - name: Check new UI JavaScript
        run: node --check signal-focus/public/autoscan-ui.js
