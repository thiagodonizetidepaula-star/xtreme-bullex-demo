name: Verify illustrated patterns on clean-v1

on:
  push:
    branches: [feat/clean-v1-six-illustrated-entries-20261025]
  pull_request:
    branches: [xtreme-clean-v1]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m py_compile clean_v1/*.py
      - name: Tests for the six illustrated patterns
        run: python -m unittest test_clean_illustrated_patterns -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify service has no live demo order
        run: |
          python - <<'PY'
          import json,sys,urllib.request
          url='https://xtreme-bot-clean-v1.onrender.com/api/state'
          req=urllib.request.Request(url,headers={'User-Agent':'Xtreme-Deploy-Preflight/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=25) as resp:
                  data=json.load(resp)
          except Exception as exc:
              print('Não foi possível validar que não há ordem aberta: '+type(exc).__name__)
              sys.exit(3)
          running=bool(data.get('running'))
          pending=bool(data.get('pending'))
          current_order=bool(data.get('current_order_id'))
          print('Bot running:',running,'pending:',pending,'active order:',current_order)
          if running or pending or current_order:
              print('Publicação bloqueada: sessão PRACTICE ativa.')
              sys.exit(4)
          print('Pré-validação: sem sessão ativa ou ordem pendente.')
          PY
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("clean_v1/app.py").read_text()
          first=src.index('<script>')+len('<script>')
          last=src.index('</script>',first)
          Path('/tmp/xtreme-clean-ui.js').write_text(src[first:last])
          PY
          node --check /tmp/xtreme-clean-ui.js
